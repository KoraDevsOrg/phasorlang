                const re1 = this.isComplex[s1] ? this.rCompReal[s1] : this.rScalar[s1];
                const im1 = this.isComplex[s1] ? this.rCompImag[s1] : 0;
                const re2 = this.isComplex[s2] ? this.rCompReal[s2] : this.rScalar[s2];
                const im2 = this.isComplex[s2] ? this.rCompImag[s2] : 0;
                this.rCompReal[dst] = re1 - re2;
                this.rCompImag[dst] = im1 - im2;
                this.isComplex[dst] = 1;
                this.isVector3[dst] = 0;
              } else {
                this.rScalar[dst] = this.rScalar[s1] - this.rScalar[s2];
                this.isComplex[dst] = 0;
                this.isVector3[dst] = 0;
              }
              break;
            case 0x12: case 0x05: // MUL
              if (this.isComplex[s1] || this.isComplex[s2]) {
                const re1 = this.isComplex[s1] ? this.rCompReal[s1] : this.rScalar[s1];
                const im1 = this.isComplex[s1] ? this.rCompImag[s1] : 0;
                const re2 = this.isComplex[s2] ? this.rCompReal[s2] : this.rScalar[s2];
                const im2 = this.isComplex[s2] ? this.rCompImag[s2] : 0;
                this.rCompReal[dst] = re1 * re2 - im1 * im2;
                this.rCompImag[dst] = re1 * im2 + im1 * re2;
                this.isComplex[dst] = 1;
                this.isVector3[dst] = 0;
              } else {
                this.rScalar[dst] = this.rScalar[s1] * this.rScalar[s2];
                this.isComplex[dst] = 0;
                this.isVector3[dst] = 0;
              }
              break;
            case 0x13: case 0x06: // DIV
              if (this.isComplex[s1] || this.isComplex[s2]) {
                const re1 = this.isComplex[s1] ? this.rCompReal[s1] : this.rScalar[s1];
                const im1 = this.isComplex[s1] ? this.rCompImag[s1] : 0;
                const re2 = this.isComplex[s2] ? this.rCompReal[s2] : this.rScalar[s2];
                const im2 = this.isComplex[s2] ? this.rCompImag[s2] : 0;
                const den = re2 * re2 + im2 * im2;
                if (den !== 0) {
                  this.rCompReal[dst] = (re1 * re2 + im1 * im2) / den;
                  this.rCompImag[dst] = (im1 * re2 - re1 * im2) / den;
                } else {
                  const newPc = this.handleException(new Error('División por cero en números complejos'));
                  if (newPc >= 0) { pc = newPc; break; }
                  this.rCompReal[dst] = 0;
                  this.rCompImag[dst] = 0;
                }
                this.isComplex[dst] = 1;
                this.isVector3[dst] = 0;
              } else {
                if (this.rScalar[s2] === 0) {
                  const newPc = this.handleException(new Error('División por cero'));
                  if (newPc >= 0) { pc = newPc; break; }
                }
                this.rScalar[dst] = (this.rScalar[s2] !== 0) ? (this.rScalar[s1] / this.rScalar[s2]) : 0;
                this.isComplex[dst] = 0;
                this.isVector3[dst] = 0;
              }
              break;
            case 0x07: pc = (instr & 0xFFFF); break;
            case 0x08: if (this.rScalar[dst] === 0.0) pc = (instr & 0xFFFF); break;
            case 0x28: case 0x09: { // MAKE_PHASOR
              const mag = this.rScalar[s1];
              const rad = this.rScalar[s2] * (Math.PI / 180.0);
              this.rCompReal[dst] = mag * Math.cos(rad);
              this.rCompImag[dst] = mag * Math.sin(rad);
              this.isComplex[dst] = 1;
              this.isVector3[dst] = 0;
              break;
            }
            case 0x30: case 0x0A: { // OUT
              if (dst === 1) {
                const s = (typeof STRINGS !== 'undefined' && STRINGS[s1] !== undefined) ? STRINGS[s1] : '';
                this.logs.push(`> OUT: ${s}\n`);
              } else if (dst === 2) {
                const strIdx = Math.floor(this.rScalar[s1]);
                const s = (typeof STRINGS !== 'undefined' && STRINGS[strIdx] !== undefined) ? STRINGS[strIdx] : '';
                this.logs.push(`> OUT: ${s}\n`);
              } else {
                const reg = s1;
                if (this.isVector3[reg]) {
                  this.logs.push(`> OUT: [${this.rVecX[reg].toFixed(4)}, ${this.rVecY[reg].toFixed(4)}, ${this.rVecZ[reg].toFixed(4)}]\n`);
                } else if (this.isComplex[reg]) {
                  const re = this.rCompReal[reg], im = this.rCompImag[reg];
                  const mag = Math.hypot(re, im);
                  const deg = Math.atan2(im, re) * (180.0 / Math.PI);
                  this.logs.push(`> OUT: ${re.toFixed(2)} + ${im.toFixed(2)}j (${mag.toFixed(2)} @ ${deg.toFixed(2)}°)\n`);
                } else {
                  this.logs.push(`> OUT: ${this.rScalar[reg].toFixed(4)}\n`);
                }
              }
              break;
            }
            case 0x36: { // OP_PANIC
              const msg = (dst === 1) ? ((typeof STRINGS !== 'undefined' && STRINGS[s1] !== undefined) ? STRINGS[s1] : 'Pánico') : (s2 > 0 ? this.rScalar[s2] : 'Pánico');
              const newPc = this.handleException(new Error('[Phasor Panic] ' + msg));
              if (newPc >= 0) pc = newPc;
              break;
            }
            case 0x37: { // OP_TRY_ENTER
              this.tryStack.push({ catchPc: instr & 0xFFFF, errReg: dst });
              break;
            }
            case 0x38: { // OP_TRY_EXIT
              if (this.tryStack.length > 0) this.tryStack.pop();
              break;
            }

            // Opcodes Vectoriales SIMD (0x60 - 0x6D)
            case 0x60: { // OP_VEC3_LOAD
              const extra = this.code[pc++];
              const rZ = (extra >>> 8) & 0xFF;
              this.rVecX[dst] = this.rScalar[s1];
              this.rVecY[dst] = this.rScalar[s2];
              this.rVecZ[dst] = this.rScalar[rZ];
              this.isVector3[dst] = 1;
              this.isComplex[dst] = 0;
              break;
            }
            case 0x61: { // OP_VEC3_ADD
              this.rVecX[dst] = this.rVecX[s1] + this.rVecX[s2];
              this.rVecY[dst] = this.rVecY[s1] + this.rVecY[s2];
              this.rVecZ[dst] = this.rVecZ[s1] + this.rVecZ[s2];
              this.isVector3[dst] = 1;
              break;
            }
            case 0x62: { // OP_VEC3_SUB
              this.rVecX[dst] = this.rVecX[s1] - this.rVecX[s2];
              this.rVecY[dst] = this.rVecY[s1] - this.rVecY[s2];
              this.rVecZ[dst] = this.rVecZ[s1] - this.rVecZ[s2];
              this.isVector3[dst] = 1;
              break;
            }
            case 0x63: { // OP_VEC3_SCALE
              const s = this.rScalar[s2];
              this.rVecX[dst] = this.rVecX[s1] * s;
              this.rVecY[dst] = this.rVecY[s1] * s;
              this.rVecZ[dst] = this.rVecZ[s1] * s;
              this.isVector3[dst] = 1;
              break;
            }
            case 0x64: { // OP_VEC3_DOT
              if (wasmExports && wasmExports.vec3_dot) {
                this.rScalar[dst] = wasmExports.vec3_dot(this.rVecX[s1], this.rVecY[s1], this.rVecZ[s1], this.rVecX[s2], this.rVecY[s2], this.rVecZ[s2]);
              } else {
                this.rScalar[dst] = this.rVecX[s1] * this.rVecX[s2] + this.rVecY[s1] * this.rVecY[s2] + this.rVecZ[s1] * this.rVecZ[s2];
              }
              this.isVector3[dst] = 0;
              break;
            }
            case 0x65: { // OP_VEC3_CROSS
              const x1 = this.rVecX[s1], y1 = this.rVecY[s1], z1 = this.rVecZ[s1];
              const x2 = this.rVecX[s2], y2 = this.rVecY[s2], z2 = this.rVecZ[s2];
              this.rVecX[dst] = y1 * z2 - z1 * y2;
              this.rVecY[dst] = z1 * x2 - x1 * z2;
              this.rVecZ[dst] = x1 * y2 - y1 * x2;
              this.isVector3[dst] = 1;
              break;
            }
            case 0x66: { // OP_VEC3_MAG
              if (wasmExports && wasmExports.vec3_mag) {
                this.rScalar[dst] = wasmExports.vec3_mag(this.rVecX[s1], this.rVecY[s1], this.rVecZ[s1]);
              } else {
                this.rScalar[dst] = Math.hypot(this.rVecX[s1], this.rVecY[s1], this.rVecZ[s1]);
              }
              this.isVector3[dst] = 0;
              break;
            }
            case 0x67: { // OP_VEC3_NORM
              const m = Math.hypot(this.rVecX[s1], this.rVecY[s1], this.rVecZ[s1]);
              if (m !== 0) {
                this.rVecX[dst] = this.rVecX[s1] / m;
                this.rVecY[dst] = this.rVecY[s1] / m;
                this.rVecZ[dst] = this.rVecZ[s1] / m;
              } else {
                this.rVecX[dst] = 0; this.rVecY[dst] = 0; this.rVecZ[dst] = 0;
              }
              this.isVector3[dst] = 1;
              break;
            }
            case 0x69: this.rScalar[dst] = this.rVecX[s1]; this.isVector3[dst] = 0; break;
            case 0x6A: this.rScalar[dst] = this.rVecY[s1]; this.isVector3[dst] = 0; break;
            case 0x6B: this.rScalar[dst] = this.rVecZ[s1]; this.isVector3[dst] = 0; break;
            case 0x6C: this.rScalar[dst] = this.isComplex[s1] ? this.rCompReal[s1] : this.rScalar[s1]; this.isVector3[dst] = 0; break;
            case 0x6D: this.rScalar[dst] = this.isComplex[s1] ? this.rCompImag[s1] : 0.0; this.isVector3[dst] = 0; break;

            // Opcodes Structure of Arrays (SoA) (0x70 - 0x74)
            case 0x70: { // OP_SOA_ALLOC
              const fields = Math.floor(this.rScalar[s1]);
              const cap = Math.floor(this.rScalar[s2]);
              const needed = fields * cap;
              const base = this.heapPtr;
              this.heapPtr += needed;
              this.rScalar[dst] = base;
              this.isVector3[dst] = 0;
              break;
            }
            case 0x71: { // OP_SOA_LOAD
              const extra = this.code[pc++];
              const rIdx = (extra >>> 16) & 0xFFFF;
              const rCap = (extra >>> 8) & 0xFF;
              const base = Math.floor(this.rScalar[s1]);
              const field = Math.floor(this.rScalar[s2]);
              const idx = Math.floor(this.rScalar[rIdx]);
              const cap = Math.floor(this.rScalar[rCap]);
              const off = base + field * cap + idx;
              if (idx < 0 || idx >= cap || off < 0 || off >= this.heapVectors.length) {
                const newPc = this.handleException(new Error('Acceso SoA fuera de límites (Out of Bounds)'));
                if (newPc >= 0) { pc = newPc; break; }
              }
              this.rScalar[dst] = this.heapVectors[off] || 0.0;
              this.isVector3[dst] = 0;
              break;
            }
            case 0x72: { // OP_SOA_STORE
              const extra = this.code[pc++];
              const rIdx = (extra >>> 16) & 0xFFFF;
              const rCap = (extra >>> 8) & 0xFF;
              const base = Math.floor(this.rScalar[dst]);
              const val = Math.floor(this.rScalar[s1]);
              const field = Math.floor(this.rScalar[s2]);
              const idx = Math.floor(this.rScalar[rIdx]);
              const cap = Math.floor(this.rScalar[rCap]);
              const off = base + field * cap + idx;
              if (idx < 0 || idx >= cap || off < 0 || off >= this.heapVectors.length) {
                const newPc = this.handleException(new Error('Escritura SoA fuera de límites (Out of Bounds)'));
                if (newPc >= 0) { pc = newPc; break; }
              }
              this.heapVectors[off] = this.rScalar[val];
              break;
            }
            case 0x73: { // OP_SOA_STEP_SIMD (Aceleración WASM / Fallback JS)
              const extra = this.code[pc++];
              const rDt = extra & 0xFF;
              const basePos = Math.floor(this.rScalar[dst]);
              const baseVel = Math.floor(this.rScalar[s1]);
              const count = Math.floor(this.rScalar[s2]);
              const dt = this.rScalar[rDt];
              if (wasmExports && wasmExports.simd_step) {
                wasmExports.simd_step(basePos, baseVel, count, dt);
              } else {
                const px = basePos, py = basePos + count, pz = basePos + 2 * count;
                const vx = baseVel, vy = baseVel + count, vz = baseVel + 2 * count;
                for (let i = 0; i < count; i++) {
                  this.heapVectors[px + i] += this.heapVectors[vx + i] * dt;
                  this.heapVectors[py + i] += this.heapVectors[vy + i] * dt;
                  this.heapVectors[pz + i] += this.heapVectors[vz + i] * dt;
                }
              }
              break;
            }
            case 0x74: { // OP_SOA_INIT_VEL
              const extra = this.code[pc++];
              const rVy = (extra >>> 16) & 0xFFFF;
              const rVz = (extra >>> 8) & 0xFF;
              const base = Math.floor(this.rScalar[dst]);
              const count = Math.floor(this.rScalar[s1]);
              const vx = this.rScalar[s2];
              const vy = this.rScalar[rVy];
              const vz = this.rScalar[rVz];
              if (wasmExports && wasmExports.simd_init_vel) {
                wasmExports.simd_init_vel(base, count, vx, vy, vz);
              } else {
                const offX = base, offY = base + count, offZ = base + 2 * count;
                for (let i = 0; i < count; i++) {
                  this.heapVectors[offX + i] = vx;
                  this.heapVectors[offY + i] = vy;
                  this.heapVectors[offZ + i] = vz;
                }
              }
              break;
            }

            case 0x50:
              this.pushUi(0x50, this.rScalar[dst]);
              break;
            case 0x51: {
              const rx = this.code[pc++], ry = this.code[pc++], rw = this.code[pc++];
              const extra = this.code[pc++];
              const rh = (extra >>> 16) & 0xFFFF, rc = (extra >>> 8) & 0xFF;
              this.pushUi(0x51, this.rScalar[rx], this.rScalar[ry], this.rScalar[rw], this.rScalar[rh], this.rScalar[rc]);
              break;
            }
            case 0x52: {
              const rcx = this.code[pc++], rcy = this.code[pc++], rr = this.code[pc++];
              const extra = this.code[pc++];
              const rc = (extra >>> 16) & 0xFFFF;
              this.pushUi(0x52, this.rScalar[rcx], this.rScalar[rcy], this.rScalar[rr], this.rScalar[rc], 0);
              break;
            }
            case 0x53: {
              const rx1 = this.code[pc++], ry1 = this.code[pc++], rx2 = this.code[pc++];
              const extra = this.code[pc++];
              const ry2 = (extra >>> 16) & 0xFFFF, lc = (extra >>> 8) & 0xFF;
              this.pushUi(0x53, this.rScalar[rx1], this.rScalar[ry1], this.rScalar[rx2], this.rScalar[ry2], this.rScalar[lc]);
              break;
            }
            case 0x54: {
              const tx = this.code[pc++], ty = this.code[pc++], strIdx = this.code[pc++];
              const extra = this.code[pc++];
              const tc = (extra >>> 16) & 0xFFFF, varReg = (extra >>> 8) & 0xFF;
              const px = this.rScalar[tx], py = this.rScalar[ty];
              let displayText = "";
              if (varReg !== 0xFF) {
                displayText = this.rScalar[varReg].toFixed(2);
              } else {
                displayText = (typeof STRINGS !== 'undefined' && STRINGS[strIdx] !== undefined) ? STRINGS[strIdx] : "";
              }
              this.pushUi(0x54, px, py, tc, 0, 0);
              this.texts.push({ text: displayText, x: px, y: py, color: tc, signalReg: (varReg !== 0xFF ? varReg : -1) });
              break;
            }
            case 0x56: {
              const bx = this.code[pc++], by = this.code[pc++], bw = this.code[pc++];
              const extra = this.code[pc++];
              const bh = (extra >>> 16) & 0xFFFF, strIdx = (extra >>> 8) & 0xFF;
              const extra2 = this.code[pc++];
              const actHash = extra2;
              const px = this.rScalar[bx], py = this.rScalar[by], pw = this.rScalar[bw], ph = this.rScalar[bh];
              const label = (typeof STRINGS !== 'undefined' && STRINGS[strIdx] !== undefined) ? STRINGS[strIdx] : 'BOTÓN';
              this.pushUi(0x56, px, py, pw, ph, 0x1f6feb);
              this.buttons.push({ x: px, y: py, w: pw, h: ph, target: actHash, label: label });
              break;
            }
            case 0x57: {
              const extra = this.code[pc++];
              handleActionOrNavigate(extra);
              break;
            }
            default:
              break;
          }
        }
      }
    }

    const canvas = document.getElementById('stage');
    const container = document.getElementById('canvas-container');
    const ctx = canvas.getContext('2d');
    const consoleEl = document.getElementById('console');

    let currentScreenPc = FIRST_SCREEN_PC;
    const vm = new MicroPhasorVM(BYTECODE, CONST_POOL);
    window.vm = vm;
    window.currentScreenPc = currentScreenPc;
    vm.run(0);
    if (vm.logs.length > 0) {
      consoleEl.textContent += '\n' + vm.logs.join('');
    }

    function navigateTo(target) {
      let entryPc = target;
      const key = String(Math.round(Number(target)));
      if (SCREEN_ROUTES[key] !== undefined) {
        entryPc = SCREEN_ROUTES[key];
      } else if (SCREEN_ROUTES[target] !== undefined) {
        entryPc = SCREEN_ROUTES[target];
      }
      currentScreenPc = entryPc;
      vm.run(entryPc);
      render(null);
    }
    window.navigateTo = navigateTo;

    function handleActionOrNavigate(target) {
      const key = String(Math.round(Number(target)));
      if (typeof ACTION_ROUTES !== 'undefined' && (ACTION_ROUTES[key] !== undefined || ACTION_ROUTES[target] !== undefined)) {
        const actionPc = ACTION_ROUTES[key] !== undefined ? ACTION_ROUTES[key] : ACTION_ROUTES[target];
        const oldScalars = new Float64Array(vm.rScalar);
        vm.run(actionPc);
        let dirty = null;
        for (const t of vm.texts) {
          if (t.signalReg !== -1 && vm.rScalar[t.signalReg] !== oldScalars[t.signalReg]) {
            if (!dirty) {
              dirty = { x: t.x - 4, y: t.y - 4, w: 160, h: 28 };
            } else {
              const x1 = Math.min(dirty.x, t.x - 4);
              const y1 = Math.min(dirty.y, t.y - 4);
              const x2 = Math.max(dirty.x + dirty.w, t.x + 160);
              const y2 = Math.max(dirty.y + dirty.h, t.y + 28);
              dirty = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
            }
          }
        }
        vm.run(currentScreenPc);
        render(dirty);
        return;
      }
      navigateTo(target);
    }
    window.handleActionOrNavigate = handleActionOrNavigate;

    function colorHex(c) {
      const n = (Number(c) >>> 0) & 0xFFFFFF;
      return '#' + n.toString(16).padStart(6, '0');
    }

    function render(dirtyRect = null) {
      if (!dirtyRect || canvas.width === 0) {
        canvas.width = container.clientWidth || window.innerWidth;
        canvas.height = container.clientHeight || (window.innerHeight * 0.76);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.save();
        ctx.beginPath();
        ctx.rect(dirtyRect.x, dirtyRect.y, dirtyRect.w, dirtyRect.h);
        ctx.clip();
        ctx.clearRect(dirtyRect.x, dirtyRect.y, dirtyRect.w, dirtyRect.h);
      }

      const cmds = vm.uiCmds;
      let btnIdx = 0;
      let textIdx = 0;
      for (let i = 0; i < cmds.length; i += 6) {
        const type = Math.floor(cmds[i]);
        const p1 = cmds[i+1], p2 = cmds[i+2], p3 = cmds[i+3], p4 = cmds[i+4], p5 = cmds[i+5];

        if (type === 0x50) {
          ctx.fillStyle = colorHex(p1);
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else if (type === 0x51) {
          ctx.fillStyle = colorHex(p5);
          ctx.fillRect(p1, p2, p3, p4);
        } else if (type === 0x52) {
          ctx.strokeStyle = colorHex(p4);
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(p1, p2, p3, 0, Math.PI * 2);
          ctx.stroke();
        } else if (type === 0x53) {
          ctx.strokeStyle = colorHex(p5);
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(p1, p2);
          ctx.lineTo(p3, p4);
          ctx.stroke();
        } else if (type === 0x54) {
          if (vm.texts && textIdx < vm.texts.length) {
            const t = vm.texts[textIdx++];
            ctx.fillStyle = colorHex(t.color);
            ctx.font = '16px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(t.text, t.x, t.y);
          }
        } else if (type === 0x56) {
          ctx.fillStyle = colorHex(p5);
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(p1, p2, p3, p4, 8);
          } else {
            ctx.fillRect(p1, p2, p3, p4);
          }
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 15px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          let btnText = 'ACCIÓN';
          if (vm.buttons && btnIdx < vm.buttons.length) {
            btnText = vm.buttons[btnIdx].label || btnText;
          }
          btnIdx++;
          ctx.fillText(btnText, p1 + (p3 / 2), p2 + (p4 / 2));
        }
      }
      if (dirtyRect) {
        ctx.restore();
      }
    }
    window.render = render;

    function handlePointer(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const touchX = (e.clientX - rect.left) * scaleX;
      const touchY = (e.clientY - rect.top) * scaleY;
      for (const b of vm.buttons) {
        if (touchX >= b.x && touchX <= b.x + b.w && touchY >= b.y && touchY <= b.y + b.h) {
          handleActionOrNavigate(b.target);
          break;
        }
      }
    }
    canvas.addEventListener('pointerdown', handlePointer);
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;
      let hovering = false;
      for (const b of vm.buttons) {
        if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
          hovering = true;
          break;
        }
      }
      canvas.style.cursor = hovering ? 'pointer' : 'default';
    });

    window.addEventListener('resize', () => render(null));
    setTimeout(() => render(null), 30);
  </script>
</body>
