// ===============================================================================
// CHRONOS IDE — APLICATIVO PRINCIPAL TOROIDAL (chronos_ide.ph)
// PhasorLang v1.0 [KoraDevs Autonomous Ecosystem]
// Arquitectura Soberana: 100% Código PhasorLang Puro & Modular
// Mundo Toroidal 2D (T^2) + Modo Celular Focus Viewport + Modo Escritorio Stark HUD
// Invariante Estricto: Zero-GC a 120 FPS Nativos
// ===============================================================================

// -------------------------------------------------------------------------------
// 1. IMPORTACIONES MODULARES
// -------------------------------------------------------------------------------
// >>> BEGIN IMPORT: lib/ui_spatial_main.ph
// ===============================================================================
// LIB/UI_SPATIAL_MAIN.PH — ESPACIO TOROIDAL 2D CONTINUO (MÓVIL + ESCRITORIO)
// PhasorLang v1.0 [KoraDevs Autonomous Ecosystem]
// Topología: Toroide T^2 = S^1 x S^1 con Wrap-Around Infinito en 4 Direcciones
// Invariante Estricto: 0 bytes en Heap, bucles deterministas a 120 FPS Zero-GC
// ===============================================================================

// -------------------------------------------------------------------------------
// 1. VARIABLES GLOBALES DE ESTADO DEL ESPACIO TOROIDAL
// -------------------------------------------------------------------------------
signal spatial_pan_x = 0.0
signal spatial_pan_y = 0.0
signal spatial_target_x = 0.0
signal spatial_target_y = 0.0
signal spatial_is_panning = 0.0
signal spatial_anchor_mx = 0.0
signal spatial_anchor_my = 0.0
signal spatial_anchor_pan_x = 0.0
signal spatial_anchor_pan_y = 0.0

// Dimensiones del universo toroidal y celdas (2x2 cuadrantes por defecto)
signal spatial_univ_w = 1600.0
signal spatial_univ_h = 1200.0
signal spatial_cell_w = 800.0
signal spatial_cell_h = 600.0
signal spatial_grid_step = 64.0
signal spatial_sector_col = 0.0
signal spatial_sector_row = 0.0

// Modo de vista: 0=Auto, 1=Forzar Móvil (1 pantalla enfocada), 2=Forzar Escritorio
signal spatial_view_mode = 0.0

signal spatial_bg_color = 0x090D13
signal spatial_grid_color = 0x161F2E
signal spatial_star_color = 0x30363D

// Buffer SoA de Telemetría del Fondo Espacial (10 campos x 1 entidad)
spatial_main_soa = alloc_soa(10, 1)

// -------------------------------------------------------------------------------
// 2. INICIALIZACIÓN Y SINCRONIZACIÓN DE GEOMETRÍA TOROIDAL
// -------------------------------------------------------------------------------
spatial_main_init(univ_w, univ_h, grid_step) = {
    uw = univ_w
    if (uw < 480.0) { uw = 1600.0 } else { 1.0 }
    uh = univ_h
    if (uh < 480.0) { uh = 1200.0 } else { 1.0 }
    gs = grid_step
    if (gs < 20.0) { gs = 64.0 } else { 1.0 }

    spatial_univ_w = uw
    spatial_univ_h = uh
    spatial_cell_w = uw * 0.5
    spatial_cell_h = uh * 0.5
    spatial_grid_step = gs
    spatial_pan_x = 0.0
    spatial_pan_y = 0.0
    spatial_target_x = 0.0
    spatial_target_y = 0.0
    spatial_is_panning = 0.0

    set_soa(spatial_main_soa, 0, 0, 1, 0.0)
    set_soa(spatial_main_soa, 1, 0, 1, 0.0)
    set_soa(spatial_main_soa, 7, 0, 1, uw)
    set_soa(spatial_main_soa, 8, 0, 1, uh)
    set_soa(spatial_main_soa, 9, 0, 1, gs)
    1.0
}

spatial_is_mobile_view(sw) = {
    mob = 0.0
    if (spatial_view_mode == 1.0) {
        mob = 1.0
    } else {
        if (spatial_view_mode == 2.0) {
            mob = 0.0
        } else {
            if (sw < 768.0) { mob = 1.0 } else { mob = 0.0 }
        }
    }
    mob
}

// Ajusta el tamaño de celda del toroide según el modo (Celular vs Escritorio)
spatial_sync_topology(sw, sh) = {
    mob = spatial_is_mobile_view(sw)
    if (mob == 1.0) {
        cw = sw
        ch = sh - 56.0
        if (ch < 220.0) { ch = 220.0 } else { 1.0 }
        uw = cw * 2.0
        uh = ch * 2.0
        if (abs(spatial_univ_w - uw) > 1.0) {
            spatial_cell_w = cw
            spatial_cell_h = ch
            spatial_univ_w = uw
            spatial_univ_h = uh
            spatial_target_x = 0.0 - (spatial_sector_col * cw)
            spatial_target_y = 0.0 - (spatial_sector_row * ch)
            spatial_pan_x = spatial_target_x
            spatial_pan_y = spatial_target_y
        } else { 1.0 }
    } else {
        uw = 1680.0
        uh = 1040.0
        if (abs(spatial_univ_w - uw) > 1.0) {
            spatial_univ_w = uw
            spatial_univ_h = uh
            spatial_cell_w = uw * 0.5
            spatial_cell_h = uh * 0.5
            spatial_pan_x = 0.0
            spatial_pan_y = 0.0
            spatial_target_x = 0.0
            spatial_target_y = 0.0
        } else { 1.0 }
    }
    1.0
}

// -------------------------------------------------------------------------------
// 3. MATEMÁTICA PURA TOROIDAL: WRAPAROUND MODULAR BIDIMENSIONAL (T^2)
// -------------------------------------------------------------------------------
spatial_main_wrap_coord(val, max_size) = {
    res = val % max_size
    if (res < 0.0) {
        res = res + max_size
    } else {
        1.0
    }
    res
}

// Periodic Boundary Condition (PBC): Distancia continua en [-max_size/2, +max_size/2]
spatial_main_wrap_pbc(val, max_size) = {
    m = val % max_size
    if (m < 0.0) { m = m + max_size } else { 1.0 }
    half = max_size * 0.5
    if (m > half) { m = m - max_size } else { 1.0 }
    m
}

// Proyección World -> Screen con Wraparound Toroidal sin cortes en bordes
spatial_world_to_screen_x(world_x, obj_w, viewport_w) = {
    uw = spatial_univ_w
    if (uw < 300.0) { uw = 1600.0 } else { 1.0 }
    raw_x = world_x + spatial_pan_x
    m = raw_x % uw
    if (m < 0.0) { m = m + uw } else { 1.0 }
    // Si la ventana cruza el borde derecho del toroide, envolver hacia la izquierda
    if (m > (uw - (obj_w * 0.5))) {
        m = m - uw
    } else { 1.0 }
    m
}

spatial_world_to_screen_y(world_y, obj_h, viewport_h) = {
    uh = spatial_univ_h
    if (uh < 300.0) { uh = 1200.0 } else { 1.0 }
    raw_y = world_y + spatial_pan_y
    m = raw_y % uh
    if (m < 0.0) { m = m + uh } else { 1.0 }
    if (m > (uh - (obj_h * 0.5))) {
        m = m - uh
    } else { 1.0 }
    m
}

// -------------------------------------------------------------------------------
// 4. NAVEGACIÓN POR CUADRANTES TOROIDALES (BOTONES D-PAD Y SWIPE MAGNÉTICO)
// -------------------------------------------------------------------------------
spatial_step_sector(dcol, drow) = {
    nc = (spatial_sector_col + dcol) % 2.0
    if (nc < 0.0) { nc = nc + 2.0 } else { 1.0 }
    nr = (spatial_sector_row + drow) % 2.0
    if (nr < 0.0) { nr = nr + 2.0 } else { 1.0 }
    spatial_sector_col = nc
    spatial_sector_row = nr

    // Calcular desplazamiento continuo más corto en el toroide
    desired_x = 0.0 - (nc * spatial_cell_w)
    desired_y = 0.0 - (nr * spatial_cell_h)
    diff_x = spatial_main_wrap_pbc(desired_x - spatial_pan_x, spatial_univ_w)
    diff_y = spatial_main_wrap_pbc(desired_y - spatial_pan_y, spatial_univ_h)

    spatial_target_x = spatial_pan_x + diff_x
    spatial_target_y = spatial_pan_y + diff_y
    1.0
}

spatial_go_sector(col, row) = {
    nc = col % 2.0
    if (nc < 0.0) { nc = nc + 2.0 } else { 1.0 }
    nr = row % 2.0
    if (nr < 0.0) { nr = nr + 2.0 } else { 1.0 }
    spatial_sector_col = nc
    spatial_sector_row = nr

    desired_x = 0.0 - (nc * spatial_cell_w)
    desired_y = 0.0 - (nr * spatial_cell_h)
    diff_x = spatial_main_wrap_pbc(desired_x - spatial_pan_x, spatial_univ_w)
    diff_y = spatial_main_wrap_pbc(desired_y - spatial_pan_y, spatial_univ_h)

    spatial_target_x = spatial_pan_x + diff_x
    spatial_target_y = spatial_pan_y + diff_y
    1.0
}

// Actualiza interpolación exponencial suave hacia el objetivo toroidal (120 FPS Zero-GC)
spatial_main_tick(sw) = {
    if (spatial_is_panning == 0.0) {
        mob = spatial_is_mobile_view(sw)
        if (mob == 1.0) {
            err_x = spatial_target_x - spatial_pan_x
            err_y = spatial_target_y - spatial_pan_y
            if ((abs(err_x) > 0.4) || (abs(err_y) > 0.4)) {
                spatial_pan_x = spatial_pan_x + (err_x * 0.22)
                spatial_pan_y = spatial_pan_y + (err_y * 0.22)
            } else {
                spatial_pan_x = spatial_main_wrap_coord(spatial_target_x, spatial_univ_w)
                spatial_pan_y = spatial_main_wrap_coord(spatial_target_y, spatial_univ_h)
                spatial_target_x = spatial_pan_x
                spatial_target_y = spatial_pan_y
            }
        } else {
            spatial_pan_x = spatial_main_wrap_coord(spatial_pan_x, spatial_univ_w)
            spatial_pan_y = spatial_main_wrap_coord(spatial_pan_y, spatial_univ_h)
        }
    } else { 1.0 }
    set_soa(spatial_main_soa, 0, 0, 1, spatial_pan_x)
    set_soa(spatial_main_soa, 1, 0, 1, spatial_pan_y)
    1.0
}

// -------------------------------------------------------------------------------
// 5. MÁQUINA DE ESTADOS DE ARRASTRE Y SWIPE TOROIDAL
// -------------------------------------------------------------------------------
spatial_main_handle_input(mx, my, mouse_down, can_pan_main, sw) = {
    mob = spatial_is_mobile_view(sw)
    if (mouse_down == 1.0) {
        if (spatial_is_panning == 1.0) {
            delta_x = mx - spatial_anchor_mx
            delta_y = my - spatial_anchor_my
            new_px = spatial_anchor_pan_x + delta_x
            new_py = spatial_anchor_pan_y + delta_y

            spatial_pan_x = spatial_main_wrap_coord(new_px, spatial_univ_w)
            spatial_pan_y = spatial_main_wrap_coord(new_py, spatial_univ_h)
            spatial_target_x = spatial_pan_x
            spatial_target_y = spatial_pan_y
        } else {
            if (can_pan_main == 1.0) {
                spatial_is_panning = 1.0
                spatial_anchor_mx = mx
                spatial_anchor_my = my
                spatial_anchor_pan_x = spatial_pan_x
                spatial_anchor_pan_y = spatial_pan_y
            } else { 1.0 }
        }
    } else {
        if (spatial_is_panning == 1.0) {
            spatial_is_panning = 0.0
            // En modo celular, al soltar el dedo hace snap magnético al cuadrante más cercano
            if (mob == 1.0) {
                swipe_dx = mx - spatial_anchor_mx
                swipe_dy = my - spatial_anchor_my
                dcol = 0.0
                drow = 0.0
                if (swipe_dx < -45.0) { dcol = 1.0 } else {
                    if (swipe_dx > 45.0) { dcol = -1.0 } else { 1.0 }
                }
                if (swipe_dy < -45.0) { drow = 1.0 } else {
                    if (swipe_dy > 45.0) { drow = -1.0 } else { 1.0 }
                }
                if ((dcol != 0.0) || (drow != 0.0)) {
                    spatial_step_sector(dcol, drow)
                } else {
                    spatial_go_sector(spatial_sector_col, spatial_sector_row)
                }
            } else { 1.0 }
        } else { 1.0 }
    }
    spatial_is_panning
}

// -------------------------------------------------------------------------------
// 6. RENDERIZADO DEL FONDO ESPACIAL TOROIDAL (120 FPS ZERO-GC)
// -------------------------------------------------------------------------------
spatial_main_render(viewport_w, viewport_h) = {
    cls(spatial_bg_color)

    vw = viewport_w
    vh = viewport_h
    gs = spatial_grid_step
    col_grid = spatial_grid_color
    col_star = spatial_star_color

    off_x = spatial_pan_x % gs
    if (off_x < 0.0) { off_x = off_x + gs } else { 1.0 }
    off_y = spatial_pan_y % gs
    if (off_y < 0.0) { off_y = off_y + gs } else { 1.0 }

    gx = off_x - gs
    while (gx < (vw + gs)) {
        line(gx, 32.0, gx, vh - 24.0, col_grid)
        gx = gx + gs
    }

    gy = off_y - gs
    while (gy < (vh - 24.0)) {
        if (gy >= 32.0) {
            line(0.0, gy, vw, gy, col_grid)
        } else { 1.0 }
        gy = gy + gs
    }

    sy = off_y - gs
    while (sy < (vh - 24.0)) {
        if (sy >= 32.0) {
            sx = off_x - gs
            while (sx < (vw + gs)) {
                circle(sx, sy, 1.3, col_star)
                sx = sx + gs
            }
        } else { 1.0 }
        sy = sy + gs
    }

    1.0
}

// -------------------------------------------------------------------------------
// 7. GETTERS Y ACCESO EXTERNO O(1)
// -------------------------------------------------------------------------------
spatial_main_get_pan_x() = { spatial_pan_x }
spatial_main_get_pan_y() = { spatial_pan_y }
spatial_main_is_active() = { spatial_is_panning }
spatial_main_get_univ_w() = { spatial_univ_w }
spatial_main_get_univ_h() = { spatial_univ_h }

spatial_main_set_pan(px, py) = {
    spatial_pan_x = spatial_main_wrap_coord(px, spatial_univ_w)
    spatial_pan_y = spatial_main_wrap_coord(py, spatial_univ_h)
    spatial_target_x = spatial_pan_x
    spatial_target_y = spatial_pan_y
    1.0
}

spatial_main_pan(dx, dy) = {
    spatial_pan_x = spatial_main_wrap_coord(spatial_pan_x + dx, spatial_univ_w)
    spatial_pan_y = spatial_main_wrap_coord(spatial_pan_y + dy, spatial_univ_h)
    spatial_target_x = spatial_pan_x
    spatial_target_y = spatial_pan_y
    1.0
}

// <<< END IMPORT: lib/ui_spatial_main.ph
// >>> BEGIN IMPORT: lib/ui_window_frame.ph
// ===============================================================================
// LIB/UI_WINDOW_FRAME.PH — HITO 3: MARCO Y REDIMENSIONADO 8D PERIMETRAL
// PhasorLang v1.0 [KoraDevs Autonomous Ecosystem]
// Cinemática de Bordes y Esquinas (E, S, W, N, SE, SW, NE, NW) con Anclaje Seguro
// Invariante Estricto: Zero-GC a 120 FPS Nativos
// ===============================================================================

// >>> BEGIN IMPORT: lib/ui_spatial_main.ph

// <<< END IMPORT: lib/ui_spatial_main.ph

// -------------------------------------------------------------------------------
// 1. CINEMÁTICA PURA 8D: CÁLCULO DE DIMENSIONES Y ANCLAJES (ZERO-GC)
// -------------------------------------------------------------------------------

// Calcula el nuevo ancho (W) según la dirección 8D
// E=1.0, SE=5.0, NE=7.0 aumentan con delta; W=3.0, SW=6.0, NW=8.0 disminuyen con delta
calc_resize_w(dir, orig_w, delta_w, min_w) = {
    nw = orig_w
    if (dir == 1.0) { nw = orig_w + delta_w } else {
        if (dir == 5.0) { nw = orig_w + delta_w } else {
            if (dir == 7.0) { nw = orig_w + delta_w } else {
                if (dir == 3.0) { nw = orig_w - delta_w } else {
                    if (dir == 6.0) { nw = orig_w - delta_w } else {
                        if (dir == 8.0) { nw = orig_w - delta_w } else { 1.0 }
                    }
                }
            }
        }
    }
    if (nw < min_w) { nw = min_w } else { 1.0 }
    nw
}

// Calcula la nueva posición X anclando el borde derecho si se mueve el lado oeste
calc_resize_x(dir, orig_x, orig_w, new_w) = {
    nx = orig_x
    if (dir == 3.0) { nx = (orig_x + orig_w) - new_w } else {
        if (dir == 6.0) { nx = (orig_x + orig_w) - new_w } else {
            if (dir == 8.0) { nx = (orig_x + orig_w) - new_w } else { 1.0 }
        }
    }
    nx
}

// Calcula el nuevo alto (H) según la dirección 8D
// S=2.0, SE=5.0, SW=6.0 aumentan con delta; N=4.0, NE=7.0, NW=8.0 disminuyen con delta
calc_resize_h(dir, orig_h, delta_h, min_h) = {
    nh = orig_h
    if (dir == 2.0) { nh = orig_h + delta_h } else {
        if (dir == 5.0) { nh = orig_h + delta_h } else {
            if (dir == 6.0) { nh = orig_h + delta_h } else {
                if (dir == 4.0) { nh = orig_h - delta_h } else {
                    if (dir == 7.0) { nh = orig_h - delta_h } else {
                        if (dir == 8.0) { nh = orig_h - delta_h } else { 1.0 }
                    }
                }
            }
        }
    }
    if (nh < min_h) { nh = min_h } else { 1.0 }
    nh
}

// Calcula la nueva posición Y anclando el borde inferior si se mueve el lado norte
calc_resize_y(dir, orig_y, orig_h, new_h) = {
    ny = orig_y
    if (dir == 4.0) { ny = (orig_y + orig_h) - new_h } else {
        if (dir == 7.0) { ny = (orig_y + orig_h) - new_h } else {
            if (dir == 8.0) { ny = (orig_y + orig_h) - new_h } else { 1.0 }
        }
    }
    ny
}

// -------------------------------------------------------------------------------
// 2. DETECCIÓN DE PROXIMIDAD Y HIT TESTING 8D
// -------------------------------------------------------------------------------

// Evalúa si el puntero se encuentra en alguno de los 4 bordes o 4 esquinas
// Retorna: 0.0=None, 1.0=E, 2.0=S, 3.0=W, 4.0=N, 5.0=SE, 6.0=SW, 7.0=NE, 8.0=NW
window_hit_edge_8d(wx, wy, ww, wh, screen_w, screen_h, is_min, mx, my) = {
    dir = 0.0
    if (screen_w >= 768.0) { if (is_min == 0.0) {
        hx = spatial_world_to_screen_x(wx, ww, screen_w)
        hy = spatial_world_to_screen_y(wy, wh, screen_h)
        hr = hx + ww
        hb = hy + wh
        bm = 7.0

        if (mx >= (hx - bm)) { if (mx <= (hr + bm)) {
            if (my >= (hy - bm)) { if (my <= (hb + bm)) {
                on_l = 0.0
                on_r = 0.0
                on_t = 0.0
                on_b = 0.0
                if (mx <= (hx + bm)) { on_l = 1.0 } else { 1.0 }
                if (mx >= (hr - bm)) { on_r = 1.0 } else { 1.0 }
                if (my <= (hy + 4.0)) { on_t = 1.0 } else { 1.0 }
                if (my >= (hb - bm)) { on_b = 1.0 } else { 1.0 }

                // 1. Esquinas (Tienen máxima prioridad)
                if (on_l == 1.0) {
                    if (on_t == 1.0) { dir = 8.0 } else { 1.0 }
                    if (on_b == 1.0) { dir = 6.0 } else { 1.0 }
                } else { 1.0 }
                if (on_r == 1.0) {
                    if (on_t == 1.0) { dir = 7.0 } else { 1.0 }
                    if (on_b == 1.0) { dir = 5.0 } else { 1.0 }
                } else { 1.0 }

                // 2. Bordes rectos
                if (dir == 0.0) {
                    if (on_r == 1.0) { dir = 1.0 } else { 1.0 }
                    if (on_b == 1.0) { dir = 2.0 } else { 1.0 }
                    if (on_l == 1.0) { dir = 3.0 } else { 1.0 }
                    if (on_t == 1.0) { dir = 4.0 } else { 1.0 }
                } else { 1.0 }
            } }
        } }
    } } else { 0.0 }
    dir
}

// Mapea la dirección 8D al código nativo de cursor de hardware R229
window_cursor_from_dir(dir) = {
    cur = 0.0
    // E (1) o W (3) -> ew-resize (4.0)
    if (dir == 1.0) { cur = 4.0 } else { 1.0 }
    if (dir == 3.0) { cur = 4.0 } else { 1.0 }
    // S (2) o N (4) -> ns-resize (5.0)
    if (dir == 2.0) { cur = 5.0 } else { 1.0 }
    if (dir == 4.0) { cur = 5.0 } else { 1.0 }
    // SE (5) o NW (8) -> nwse-resize (6.0)
    if (dir == 5.0) { cur = 6.0 } else { 1.0 }
    if (dir == 8.0) { cur = 6.0 } else { 1.0 }
    // SW (6) o NE (7) -> nesw-resize (7.0)
    if (dir == 6.0) { cur = 7.0 } else { 1.0 }
    if (dir == 7.0) { cur = 7.0 } else { 1.0 }
    cur
}

// Hit testing de barra de título
window_hit_title(wx, wy, ww, wh, screen_w, screen_h, mx, my) = {
    hx = spatial_world_to_screen_x(wx, ww, screen_w)
    hy = spatial_world_to_screen_y(wy, wh, screen_h)
    hit = 0.0
    if (mx >= hx) { if (mx <= (hx + ww - 28.0)) {
        if (my >= (hy + 4.0)) { if (my <= (hy + 28.0)) {
            hit = 1.0
        } }
    } }
    hit
}

// Hit testing de botón de minimizado [-] / [+]
window_hit_min_btn(wx, wy, ww, wh, screen_w, screen_h, mx, my) = {
    hx = spatial_world_to_screen_x(wx, ww, screen_w)
    hy = spatial_world_to_screen_y(wy, wh, screen_h)
    hr = hx + ww
    hit = 0.0
    btn_bx = hr - 26.0
    btn_by = hy + 4.0
    if (mx >= btn_bx) { if (mx <= btn_bx + 20.0) {
        if (my >= btn_by) { if (my <= btn_by + 20.0) {
            hit = 1.0
        } }
    } }
    hit
}

// Hit testing de esquina inferior-derecha (alias legacy para compatibilidad)
window_hit_resize_corner(wx, wy, ww, wh, screen_w, screen_h, mx, my) = {
    d = window_hit_edge_8d(wx, wy, ww, wh, screen_w, screen_h, 0.0, mx, my)
    hit = 0.0
    if (d == 5.0) { hit = 1.0 } else { 1.0 }
    hit
}

// Hit testing del cuerpo de ventana
window_hit_body(wx, wy, ww, wh, screen_w, screen_h, is_min, mx, my) = {
    hx = spatial_world_to_screen_x(wx, ww, screen_w)
    hy = spatial_world_to_screen_y(wy, wh, screen_h)
    eff_h = wh
    if (is_min == 1.0) { eff_h = 28.0 } else { 1.0 }
    hit = 0.0
    if (mx >= hx) { if (mx <= hx + ww) {
        if (my >= hy) { if (my <= hy + eff_h) {
            hit = 1.0
        } }
    } }
    hit
}

// -------------------------------------------------------------------------------
// 3. RENDERIZADO VISUAL DEL MARCO, AGARRES Y BORDES (ZERO-GC)
// -------------------------------------------------------------------------------

// Dibuja el marco base, barra de título y decoración de las 4 esquinas
render_window_frame(wx, wy, ww, wh, screen_w, screen_h, is_min) = {
    hx = spatial_world_to_screen_x(wx, ww, screen_w)
    hy = spatial_world_to_screen_y(wy, wh, screen_h)
    hr = hx + ww

    eff_h = wh
    if (is_min == 1.0) { eff_h = 28.0 } else { 1.0 }
    hb = hy + eff_h

    // Culling contra el viewport
    if (hr > -50.0) { if (hx < (screen_w + 50.0)) {
        // Fondo de la ventana
        rect(hx, hy, ww, eff_h, 0x0D1117)

        // Barra de título superior
        rect(hx, hy, ww, 28.0, 0x161B22)
        line(hx, hy + 28.0, hr, hy + 28.0, 0x30363D)

        // Botón Minimizar / Restaurar [-] / [+]
        btn_bx = hr - 24.0
        btn_by = hy + 6.0
        if (is_min == 1.0) {
            rect(btn_bx, btn_by, 16.0, 16.0, 0x238636)
            text("+", btn_bx + 5.0, btn_by + 2.0, 10, 0xFFFFFF)
        } else {
            rect(btn_bx, btn_by, 16.0, 16.0, 0x21262D)
            text("-", btn_bx + 5.0, btn_by + 1.0, 10, 0x8B949E)
        }

        // Bordes perimetrales base
        line(hx, hy, hr, hy, 0x30363D)
        line(hx, hy, hx, hb, 0x30363D)
        line(hr, hy, hr, hb, 0x30363D)
        line(hx, hb, hr, hb, 0x30363D)

        // Agarre visual en las 4 esquinas para indicar interactividad 8D (Solo escritorio)
        if (is_min == 0.0) { if (screen_w >= 768.0) {
            // Esquina SE
            line(hr - 10.0, hb - 2.0, hr - 2.0, hb - 10.0, 0x8B949E)
            line(hr - 6.0, hb - 2.0, hr - 2.0, hb - 6.0, 0x8B949E)
            // Esquina SW
            line(hx + 10.0, hb - 2.0, hx + 2.0, hb - 10.0, 0x484F58)
            // Esquina NE
            line(hr - 10.0, hy + 30.0, hr - 2.0, hy + 38.0, 0x484F58)
        } }
    } }
    1.0
}

// Sella los bordes exteriores por encima de todo contenido
render_window_borders(hx, hy, ww, wh, is_min) = {
    eff_h = wh
    if (is_min == 1.0) { eff_h = 28.0 } else { 1.0 }
    hr = hx + ww
    hb = hy + eff_h
    line(hx, hy, hr, hy, 0x30363D)
    line(hx, hy, hx, hb, 0x30363D)
    line(hr, hy, hr, hb, 0x30363D)
    line(hx, hb, hr, hb, 0x30363D)
    1.0
}

// Resalta con borde cian brillante la ventana que está siendo redimensionada activamente
render_window_active_resize_outline(wx, wy, ww, wh, screen_w, screen_h) = {
    hx = spatial_world_to_screen_x(wx, ww, screen_w)
    hy = spatial_world_to_screen_y(wy, wh, screen_h)
    hr = hx + ww
    hb = hy + wh
    // Borde doble brillante de feedback táctil/visual
    line(hx, hy, hr, hy, 0x58A6FF)
    line(hx, hy, hx, hb, 0x58A6FF)
    line(hr, hy, hr, hb, 0x58A6FF)
    line(hx, hb, hr, hb, 0x58A6FF)
    line(hx + 1.0, hy + 1.0, hr - 1.0, hy + 1.0, 0x1F6FEB)
    line(hx + 1.0, hy + 1.0, hx + 1.0, hb - 1.0, 0x1F6FEB)
    line(hr - 1.0, hy + 1.0, hr - 1.0, hb - 1.0, 0x1F6FEB)
    line(hx + 1.0, hb - 1.0, hr - 1.0, hb - 1.0, 0x1F6FEB)
    1.0
}

// Renderiza barras de scroll 2D con auto-ajuste proporcional
render_window_scrollbars(hx, hy, ww, wh, content_w, content_h, sc_x, sc_y) = {
    inner_h = wh - 30.0
    inner_w = ww - 2.0

    // Scrollbar Vertical
    if (content_h > inner_h) { if (inner_h >= 40.0) {
        sb_x = hx + ww - 7.0
        sb_y = hy + 29.0
        sb_len = inner_h - 1.0
        if (content_w > inner_w) { sb_len = inner_h - 7.0 } else { 1.0 }

        if (sb_len >= 16.0) {
            rect(sb_x, sb_y, 6.0, sb_len, 0x161B22)
            ratio = inner_h / content_h
            thumb_sz = sb_len * ratio
            if (thumb_sz < 16.0) { thumb_sz = 16.0 } else { 1.0 }
            if (thumb_sz > sb_len) { thumb_sz = sb_len } else { 1.0 }

            max_sc = content_h - inner_h
            if (max_sc < 1.0) { max_sc = 1.0 } else { 1.0 }
            travel = sb_len - thumb_sz
            if (travel < 0.0) { travel = 0.0 } else { 1.0 }

            cur_sc = sc_y
            if (cur_sc < 0.0) { cur_sc = 0.0 } else { 1.0 }
            if (cur_sc > max_sc) { cur_sc = max_sc } else { 1.0 }

            thumb_pos = sb_y + ((cur_sc / max_sc) * travel)
            if (thumb_pos < sb_y) { thumb_pos = sb_y } else { 1.0 }
            if (thumb_pos > (sb_y + travel)) { thumb_pos = sb_y + travel } else { 1.0 }

            rect(sb_x + 1.0, thumb_pos, 4.0, thumb_sz, 0x484F58)
        }
    } }

    // Scrollbar Horizontal
    if (content_w > inner_w) { if (inner_w >= 40.0) {
        sb_x = hx + 1.0
        sb_y = hy + wh - 7.0
        sb_len = inner_w - 1.0
        if (content_h > inner_h) { sb_len = inner_w - 7.0 } else { 1.0 }

        if (sb_len >= 16.0) {
            rect(sb_x, sb_y, sb_len, 6.0, 0x161B22)
            ratio = inner_w / content_w
            thumb_sz = sb_len * ratio
            if (thumb_sz < 16.0) { thumb_sz = 16.0 } else { 1.0 }
            if (thumb_sz > sb_len) { thumb_sz = sb_len } else { 1.0 }

            max_sc = content_w - inner_w
            if (max_sc < 1.0) { max_sc = 1.0 } else { 1.0 }
            travel = sb_len - thumb_sz
            if (travel < 0.0) { travel = 0.0 } else { 1.0 }

            cur_sc = sc_x
            if (cur_sc < 0.0) { cur_sc = 0.0 } else { 1.0 }
            if (cur_sc > max_sc) { cur_sc = max_sc } else { 1.0 }

            thumb_pos = sb_x + ((cur_sc / max_sc) * travel)
            if (thumb_pos < sb_x) { thumb_pos = sb_x } else { 1.0 }
            if (thumb_pos > (sb_x + travel)) { thumb_pos = sb_x + travel } else { 1.0 }

            rect(thumb_pos, sb_y + 1.0, thumb_sz, 4.0, 0x484F58)
        }
    } }
    1.0
}

// ===============================================================================
// LIB/UI_VIEWPORT.PH — HITO 4: VIEWPORT AISLADO Y SCROLL INTELIGENTE
// PhasorLang v1.0 [KoraDevs Autonomous Ecosystem]
// Geometría única (fuente de verdad) para: área cliente, clipping estricto,
// scrollbars 2D, hit-testing de thumb/pista y arrastre del thumb.
// Invariante Estricto: Zero-GC a 120 FPS Nativos (solo aritmética escalar)
//
// Convenciones:
//   top  = distancia en px desde el borde superior de la ventana hasta el área
//          cliente (28.0 sin menú local, 54.0 con barra de herramientas).
//   cw/ch = tamaño del CONTENIDO lógico. clw/clh = tamaño del ÁREA CLIENTE.
//   Hit: 0.0 = nada, 1.0 = thumb, 2.0 = pista (fuera del thumb).
//
// Disciplina PVM: cada llamada a función se asigna a una variable local antes de
// combinarse con otra operación (evita temporales compartidos entre llamadas).
// Identificadores consolidados para optimización del archivo de registros PVM.
// ===============================================================================

// -------------------------------------------------------------------------------
// 1. GEOMETRÍA DEL ÁREA CLIENTE
// -------------------------------------------------------------------------------
vp_client_w(w) = {
    w - 2.0
}

vp_client_h(h, top) = {
    h - top - 1.0
}

// 1.0 si hace falta barra vertical (considerando el espacio que roba la horizontal)
vp_show_v(cw, ch, clw, clh) = {
    val = 0.0
    if (cw > clw) { val = 1.0 } else { 1.0 }
    delta = clh - (7.0 * val)
    res = 0.0
    if (ch > delta) { res = 1.0 } else { 1.0 }
    res
}

// 1.0 si hace falta barra horizontal (considerando el espacio que roba la vertical)
vp_show_h(cw, ch, clw, clh) = {
    val = vp_show_v(cw, ch, clw, clh)
    delta = clw - (7.0 * val)
    res = 0.0
    if (cw > delta) { res = 1.0 } else { 1.0 }
    res
}

// Área visible real del contenido (descontando las barras visibles)
vp_visible_w(cw, ch, clw, clh) = {
    val = vp_show_v(cw, ch, clw, clh)
    clw - (7.0 * val)
}

vp_visible_h(cw, ch, clw, clh) = {
    val = vp_show_h(cw, ch, clw, clh)
    clh - (7.0 * val)
}

// Máximo desplazamiento permitido por eje (0.0 si todo el contenido cabe)
vp_max_x(cw, ch, clw, clh) = {
    res = vp_visible_w(cw, ch, clw, clh)
    val = cw - res
    if (val < 0.0) { val = 0.0 } else { 1.0 }
    val
}

vp_max_y(cw, ch, clw, clh) = {
    res = vp_visible_h(cw, ch, clw, clh)
    val = ch - res
    if (val < 0.0) { val = 0.0 } else { 1.0 }
    val
}

// Fuerza el desplazamiento dentro de [0, max]
vp_clamp_scroll(sc, max_sc) = {
    res = sc
    if (res > max_sc) { res = max_sc } else { 1.0 }
    if (res < 0.0) { res = 0.0 } else { 1.0 }
    res
}

// -------------------------------------------------------------------------------
// 2. CLIPPING ESTRICTO DE CONTENIDO (PRUEBA DE CONTENCIÓN TOTAL)
// -------------------------------------------------------------------------------
// 1.0 solo si el rectángulo [x, x+w] x [y, y+h] queda 100% dentro del viewport
// [cl, cr] x [ct, cb]. Nada se dibuja fuera del área cliente.
vp_rect_inside(x, y, w, h, x_min, y_min, x_max, y_max) = {
    fits = 0.0
    if (x >= x_min) { if ((x + w) <= x_max) {
        if (y >= y_min) { if ((y + h) <= y_max) {
            fits = 1.0
        } }
    } }
    fits
}

// Ancho estimado de una cadena monoespaciada de n caracteres con fuente 'font_sz'
vp_text_w(text_len, font_sz) = {
    text_len * (font_sz * 0.6)
}

// Dibuja texto si intersecta el viewport; el recorte fino lo ejecuta clip() (Zero-GC)
vp_text(text_str, text_len, font_sz, text_x, text_y, x_min, y_min, x_max, y_max, text_col) = {
    fits = 0.0
    if (text_x <= x_max) { if ((text_y + font_sz) >= y_min) { if (text_y <= y_max) {
        fits = 1.0
    } } }
    if (fits == 1.0) {
        text(text_str, text_x, text_y, font_sz, text_col)
    } else { 1.0 }
    1.0
}

// 1.0 si una fila en 'y' con altura ~14px intersecta verticalmente [ct, cb]
// Permite que el contenido se oculte suavemente píxel a píxel detrás del marco con clip()
vp_line_visible(y, ct, cb) = {
    fits = 0.0
    if ((y + 14.0) >= ct) { if (y <= cb) {
        fits = 1.0
    } }
    fits
}

// -------------------------------------------------------------------------------
// 3. GEOMETRÍA DE PISTAS Y THUMBS
// -------------------------------------------------------------------------------
vp_track_v_x(hx, w) = { hx + w - 7.0 }
vp_track_v_y(hy, top) = { hy + top + 1.0 }
vp_track_v_len(cw, ch, clw, clh) = {
    res = vp_visible_h(cw, ch, clw, clh)
    res - 1.0
}

vp_track_h_x(hx) = { hx + 1.0 }
vp_track_h_y(hy, h) = { hy + h - 7.0 }
vp_track_h_len(cw, ch, clw, clh) = {
    res = vp_visible_w(cw, ch, clw, clh)
    res - 1.0
}

// Tamaño proporcional del thumb (mínimo 16 px, máximo la pista)
vp_thumb_size(tl, val, ch) = {
    delta = 1.0
    if (ch > 1.0) { delta = val / ch } else { 1.0 }
    sz = tl * delta
    if (sz < 16.0) { sz = 16.0 } else { 1.0 }
    if (sz > tl) { sz = tl } else { 1.0 }
    sz
}

// Offset del thumb desde el inicio de la pista según el scroll actual
vp_thumb_offset(tl, sz, sc, max_sc) = {
    delta = tl - sz
    off = 0.0
    if (max_sc >= 1.0) { if (delta > 0.0) {
        val = sc
        if (val < 0.0) { val = 0.0 } else { 1.0 }
        if (val > max_sc) { val = max_sc } else { 1.0 }
        off = (val / max_sc) * delta
    } }
    off
}

// Desplazamiento resultante de colocar el inicio del thumb en 'val'
vp_scroll_from_thumb(val, ty, tl, sz, max_sc) = {
    delta = tl - sz
    res = 0.0
    if (delta >= 1.0) {
        sc = (val - ty) / delta
        if (sc < 0.0) { sc = 0.0 } else { 1.0 }
        if (sc > 1.0) { sc = 1.0 } else { 1.0 }
        res = sc * max_sc
    } else { 1.0 }
    res
}

// -------------------------------------------------------------------------------
// 4. HIT-TESTING DE BARRAS (0=nada, 1=thumb, 2=pista)
// -------------------------------------------------------------------------------
vp_hit_v(hx, hy, w, h, top, cw, ch, sc, mx, my) = {
    clw = vp_client_w(w)
    clh = vp_client_h(h, top)
    val = vp_show_v(cw, ch, clw, clh)
    hit = 0.0
    if (val == 1.0) {
        tx = vp_track_v_x(hx, w)
        ty = vp_track_v_y(hy, top)
        tl = vp_track_v_len(cw, ch, clw, clh)
        if (tl >= 16.0) { if (mx >= (tx - 4.0)) { if (mx <= (tx + 7.0)) {
            if (my >= ty) { if (my <= (ty + tl)) {
                vh = vp_visible_h(cw, ch, clw, clh)
                max_sc = vp_max_y(cw, ch, clw, clh)
                sz = vp_thumb_size(tl, vh, ch)
                off = vp_thumb_offset(tl, sz, sc, max_sc)
                delta = ty + off
                hit = 2.0
                if (my >= delta) { if (my <= (delta + sz)) { hit = 1.0 } else { 1.0 } } else { 1.0 }
            } }
        } } }
    } else { 1.0 }
    hit
}

vp_hit_h(hx, hy, w, h, top, cw, ch, sc, mx, my) = {
    clw = vp_client_w(w)
    clh = vp_client_h(h, top)
    val = vp_show_h(cw, ch, clw, clh)
    hit = 0.0
    if (val == 1.0) {
        tx = vp_track_h_x(hx)
        ty = vp_track_h_y(hy, h)
        tl = vp_track_h_len(cw, ch, clw, clh)
        if (tl >= 16.0) { if (my >= (ty - 4.0)) { if (my <= (ty + 7.0)) {
            if (mx >= tx) { if (mx <= (tx + tl)) {
                vw = vp_visible_w(cw, ch, clw, clh)
                max_sc = vp_max_x(cw, ch, clw, clh)
                sz = vp_thumb_size(tl, vw, cw)
                off = vp_thumb_offset(tl, sz, sc, max_sc)
                delta = tx + off
                hit = 2.0
                if (mx >= delta) { if (mx <= (delta + sz)) { hit = 1.0 } else { 1.0 } } else { 1.0 }
            } }
        } } }
    } else { 1.0 }
    hit
}

// -------------------------------------------------------------------------------
// 5. ARRASTRE DEL THUMB (AGARRE Y CINEMÁTICA)
// -------------------------------------------------------------------------------
vp_grab_v(hx, hy, w, h, top, cw, ch, sc, hit, my) = {
    clw = vp_client_w(w)
    clh = vp_client_h(h, top)
    tl = vp_track_v_len(cw, ch, clw, clh)
    vh = vp_visible_h(cw, ch, clw, clh)
    max_sc = vp_max_y(cw, ch, clw, clh)
    sz = vp_thumb_size(tl, vh, ch)
    val = sz * 0.5
    if (hit == 1.0) {
        ty = vp_track_v_y(hy, top)
        off = vp_thumb_offset(tl, sz, sc, max_sc)
        delta = ty + off
        val = my - delta
    } else { 1.0 }
    val
}

vp_grab_h(hx, hy, w, h, top, cw, ch, sc, hit, mx) = {
    clw = vp_client_w(w)
    clh = vp_client_h(h, top)
    tl = vp_track_h_len(cw, ch, clw, clh)
    vw = vp_visible_w(cw, ch, clw, clh)
    max_sc = vp_max_x(cw, ch, clw, clh)
    sz = vp_thumb_size(tl, vw, cw)
    val = sz * 0.5
    if (hit == 1.0) {
        tx = vp_track_h_x(hx)
        off = vp_thumb_offset(tl, sz, sc, max_sc)
        delta = tx + off
        val = mx - delta
    } else { 1.0 }
    val
}

vp_drag_scroll_v(hx, hy, w, h, top, cw, ch, grab, my) = {
    clw = vp_client_w(w)
    clh = vp_client_h(h, top)
    tl = vp_track_v_len(cw, ch, clw, clh)
    vh = vp_visible_h(cw, ch, clw, clh)
    max_sc = vp_max_y(cw, ch, clw, clh)
    ty = vp_track_v_y(hy, top)
    sz = vp_thumb_size(tl, vh, ch)
    val = my - grab
    sc_val = vp_scroll_from_thumb(val, ty, tl, sz, max_sc)
    sc_val
}

vp_drag_scroll_h(hx, hy, w, h, top, cw, ch, grab, mx) = {
    clw = vp_client_w(w)
    clh = vp_client_h(h, top)
    tl = vp_track_h_len(cw, ch, clw, clh)
    vw = vp_visible_w(cw, ch, clw, clh)
    max_sc = vp_max_x(cw, ch, clw, clh)
    tx = vp_track_h_x(hx)
    sz = vp_thumb_size(tl, vw, cw)
    val = mx - grab
    sc_val = vp_scroll_from_thumb(val, tx, tl, sz, max_sc)
    sc_val
}

// -------------------------------------------------------------------------------
// 6. RENDERIZADO DE BARRAS 2D (active_axis: 0=ninguno, 1=V arrastrando, 2=H arrastrando)
// -------------------------------------------------------------------------------
render_viewport_scrollbars(hx, hy, w, h, top, cw, ch, sc, val, active_axis) = {
    clw = vp_client_w(w)
    clh = vp_client_h(h, top)

    delta = vp_show_v(cw, ch, clw, clh)
    if (delta == 1.0) {
        tx = vp_track_v_x(hx, w)
        ty = vp_track_v_y(hy, top)
        tl = vp_track_v_len(cw, ch, clw, clh)
        if (tl >= 16.0) {
            res = vp_visible_h(cw, ch, clw, clh)
            max_sc = vp_max_y(cw, ch, clw, clh)
            sz = vp_thumb_size(tl, res, ch)
            off = vp_thumb_offset(tl, sz, val, max_sc)
            rect(tx, ty, 8.0, tl, 0x161B22)
            line(tx, ty, tx, ty + tl, 0x21262D)
            line(tx + 8.0, ty, tx + 8.0, ty + tl, 0x21262D)
            if (active_axis == 1.0) {
                rect(tx + 1.0, ty + off, 6.0, sz, 0x79C0FF)
            } else {
                rect(tx + 1.0, ty + off, 6.0, sz, 0x58A6FF)
            }
        } else { 1.0 }
    } else { 1.0 }

    delta = vp_show_h(cw, ch, clw, clh)
    if (delta == 1.0) {
        tx = vp_track_h_x(hx)
        ty = vp_track_h_y(hy, h)
        tl = vp_track_h_len(cw, ch, clw, clh)
        if (tl >= 16.0) {
            res = vp_visible_w(cw, ch, clw, clh)
            max_sc = vp_max_x(cw, ch, clw, clh)
            sz = vp_thumb_size(tl, res, cw)
            off = vp_thumb_offset(tl, sz, sc, max_sc)
            rect(tx, ty, tl, 8.0, 0x161B22)
            line(tx, ty, tx + tl, ty, 0x21262D)
            line(tx, ty + 8.0, tx + tl, ty + 8.0, 0x21262D)
            if (active_axis == 2.0) {
                rect(tx + off, ty + 1.0, sz, 6.0, 0x79C0FF)
            } else {
                rect(tx + off, ty + 1.0, sz, 6.0, 0x58A6FF)
            }
        } else { 1.0 }
    } else { 1.0 }
    1.0
}

// -------------------------------------------------------------------------------
// 1. SEÑALES DE ESTADO DEL EXPLORADOR (MEMORIA PLANA SOA ZERO-GC)
// -------------------------------------------------------------------------------
signal exp_sel = 12.0            // Nodo seleccionado (1..4=Carpetas, 11..41=Archivos)
signal exp_d1 = 1.0              // Carpeta samples/  (1.0=expandida, 0.0=contraída)
signal exp_d2 = 1.0              // Carpeta lib/      (1.0=expandida, 0.0=contraída)
signal exp_d3 = 1.0              // Carpeta docs/dist (1.0=expandida, 0.0=contraída)
signal exp_d4 = 1.0              // Carpeta modules/  (1.0=expandida, 0.0=contraída)
signal exp_has_new = 0.0         // Archivos creados (0.0, 1.0=nuevo_modulo.ph, 2.0=+custom_panel.ph)
signal exp_menu_open = 0.0       // 1.0 si el menú contextual emergente [⋮] está abierto
signal exp_menu_y = 0.0          // Offset Y relativo de la fila donde emergió el menú [⋮]
signal exp_create_open = 0.0     // 1.0 si el menú emergente "+ Nuevo ▾" de la barra está abierto
signal exp_ed_file = 0.0         // Archivo activo en Screen 1 (0=chronos_ide, 1=main, 2=ui_comp, 3=explorer, 4=nuevo)
signal exp_imp_copied = 0.0      // 1.0 si se copió la directiva import al portapapeles lógico
signal exp_edit_mod = 0.0        // 1.0 si el archivo abierto tiene edición en vivo activa (●)
signal exp_click_pending = 0.0   // Latch de clic primario pendiente de consumir en el frame actual
signal exp_rclick_pending = 0.0  // Latch de clic secundario pendiente de consumir en el frame actual

// Calcula dinámicamente la altura lógica del contenedor interior según carpetas abiertas
explorer_content_h() = {
    res = 285.0
    if (exp_d1 == 1.0) { res = res + 60.0 } else { 1.0 }
    if (exp_d1 == 1.0) {
        if (exp_has_new >= 1.0) { res = res + 18.0 } else { 1.0 }
        if (exp_has_new >= 2.0) { res = res + 18.0 } else { 1.0 }
    } else { 1.0 }
    if (exp_d2 == 1.0) { res = res + 114.0 } else { 1.0 }
    if (exp_d3 == 1.0) { res = res + 58.0 } else { 1.0 }
    if (exp_d4 == 1.0) { res = res + 22.0 } else { 1.0 }
    res
}

// Sincroniza el nodo seleccionado con el código mostrado en Screen 1 (Editor)
exp_open_selected_in_editor() = {
    if (exp_sel == 11.0) { exp_ed_file = 1.0 } else { 1.0 }
    if (exp_sel == 12.0) { exp_ed_file = 0.0 } else { 1.0 }
    if (exp_sel == 13.0) { exp_ed_file = 1.0 } else { 1.0 }
    if (exp_sel == 14.0) { exp_ed_file = 4.0 } else { 1.0 }
    if (exp_sel == 15.0) { exp_ed_file = 4.0 } else { 1.0 }
    if (exp_sel == 21.0) { exp_ed_file = 2.0 } else { 1.0 }
    if (exp_sel == 26.0) { exp_ed_file = 3.0 } else { 1.0 }
    if (exp_sel == 41.0) { exp_ed_file = 4.0 } else { 1.0 }
    1.0
}

// Alterna expandir/contraer una carpeta según su ID (1..4)
exp_toggle_folder(id) = {
    if (id == 1.0) { exp_d1 = 1.0 - exp_d1 } else { 1.0 }
    if (id == 2.0) { exp_d2 = 1.0 - exp_d2 } else { 1.0 }
    if (id == 3.0) { exp_d3 = 1.0 - exp_d3 } else { 1.0 }
    if (id == 4.0) { exp_d4 = 1.0 - exp_d4 } else { 1.0 }
    1.0
}

// Acción reutilizable para crear un nuevo archivo .ph en el árbol
exp_action_create_file() = {
    if (exp_has_new < 1.0) {
        exp_has_new = 1.0
        exp_sel = 14.0
    } else {
        exp_has_new = 2.0
        exp_sel = 15.0
    }
    exp_d1 = 1.0
    exp_ed_file = 4.0
    exp_imp_copied = 0.0
    1.0
}

// -------------------------------------------------------------------------------
// 2. COMPONENTE DECLARATIVO DE NODO (1 LÍNEA = RENDER + HOVER + CLIC + MENÚ [⋮])
// -------------------------------------------------------------------------------
exp_node(label_str, depth, is_dir, dir, id, val, nw, tmx, tmy) = {
    if (vp_line_visible(ty, ct, cb) == 1.0) {
        shape = 0.0
        if (exp_sel == id) { shape = 1.0 } else { 1.0 }
        hit = ui_tree_node(label_str, tx, ty, clw, depth, is_dir, dir, shape, nw, tmx, tmy)
        if (hit > 0.0) {
            if (exp_click_pending == 1.0) {
                exp_sel = id
                if (hit == 2.0) {
                    exp_menu_open = 1.0
                    exp_create_open = 0.0
                    exp_menu_y = ty - hy
                } else {
                    if (is_dir == 1.0) {
                        exp_toggle_folder(id)
                    } else {
                        if (val >= 0.0) { exp_ed_file = val } else { 1.0 }
                        exp_imp_copied = 0.0
                    }
                }
                exp_click_pending = 0.0
            } else { 1.0 }

            if (exp_rclick_pending == 1.0) {
                exp_sel = id
                if (val >= 0.0) { exp_ed_file = val } else { 1.0 }
                exp_menu_open = 1.0
                exp_create_open = 0.0
                exp_menu_y = ty - hy
                exp_rclick_pending = 0.0
            } else { 1.0 }
        } else { 1.0 }
    } else { 1.0 }
    if (is_dir == 1.0) { ty = ty + 20.0 } else { ty = ty + 18.0 }
    1.0
}

// -------------------------------------------------------------------------------
// 3. BARRA DE HERRAMIENTAS INTERNA REACTIVA (CON HOVER Y CLIC SIMPLE)
// -------------------------------------------------------------------------------
render_explorer_toolbar(hx, hy, w, bmx, bmy) = {
    rect(hx + 1.0, hy + 28.0, w - 2.0, 26.0, 0x161B22)
    line(hx + 1.0, hy + 54.0, hx + w - 1.0, hy + 54.0, 0x30363D)

    clip(hx + 1.0, hy + 28.0, w - 2.0, 26.0)

    // Botón 1: "+ Nuevo ▾" (Abre el Menú Emergente de Creación)
    hit = ui_button("+ Nuevo v", hx + 6.0, hy + 31.0, 58.0, 20.0, exp_create_open, 0x238636, bmx, bmy)
    if (hit == 1.0) {
        if (exp_click_pending == 1.0) {
            exp_create_open = 1.0 - exp_create_open
            exp_menu_open = 0.0
            exp_click_pending = 0.0
        } else { 1.0 }
    } else { 1.0 }

    // Botón 2: "+ Arch" (Creación instantánea de 1 clic)
    val = 0.0
    if (exp_has_new > 0.0) { val = 1.0 } else { 1.0 }
    hit = ui_button("+ Arch", hx + 68.0, hy + 31.0, 46.0, 20.0, val, 0x1F6FEB, bmx, bmy)
    if (hit == 1.0) {
        if (exp_click_pending == 1.0) {
            exp_action_create_file()
            exp_click_pending = 0.0
        } else { 1.0 }
    } else { 1.0 }

    // Botón 3: "Editar ●" (Alterna edición en vivo en Screen 1)
    hit = ui_button("Editar", hx + 118.0, hy + 31.0, 48.0, 20.0, exp_edit_mod, 0x1F6FEB, bmx, bmy)
    if (hit == 1.0) {
        if (exp_click_pending == 1.0) {
            exp_open_selected_in_editor()
            exp_edit_mod = 1.0 - exp_edit_mod
            exp_click_pending = 0.0
        } else { 1.0 }
    } else { 1.0 }

    // Botón 4: "Import" (Copia directiva import del módulo seleccionado)
    hit = ui_button("Import", hx + 170.0, hy + 31.0, 46.0, 20.0, exp_imp_copied, 0x238636, bmx, bmy)
    if (hit == 1.0) {
        if (exp_click_pending == 1.0) {
            exp_imp_copied = 1.0
            exp_click_pending = 0.0
        } else { 1.0 }
    } else { 1.0 }

    // Botón 5: "v/>" (Expandir / Contraer todas las ramas del árbol)
    val = 0.0
    if (exp_d1 == 1.0) { val = exp_d2 } else { 1.0 }
    hit = ui_button("v/>", hx + 220.0, hy + 31.0, 28.0, 20.0, val, 0x1F6FEB, bmx, bmy)
    if (hit == 1.0) {
        if (exp_click_pending == 1.0) {
            if (exp_d1 == 1.0) {
                exp_d1 = 0.0; exp_d2 = 0.0; exp_d3 = 0.0; exp_d4 = 0.0
            } else {
                exp_d1 = 1.0; exp_d2 = 1.0; exp_d3 = 1.0; exp_d4 = 1.0
            }
            exp_click_pending = 0.0
        } else { 1.0 }
    } else { 1.0 }

    unclip()
    1.0
}

// -------------------------------------------------------------------------------
// 4. DISPATCHERS DE ENTRADA DESDE CHRONOS_IDE.PH (PUENTE REACTIVO)
// -------------------------------------------------------------------------------
handle_explorer_click(hx, hy, w, h, dx, dy, mx, my) = {
    handled = 0.0
    if (my >= (hy + 28.0)) {
        if (my <= (hy + h)) {
            exp_click_pending = 1.0
            handled = 1.0
        } else { 1.0 }
    } else { 1.0 }
    handled
}

handle_explorer_tree_click(dx, dy, mx, my) = {
    exp_rclick_pending = 1.0
    1.0
}

// -------------------------------------------------------------------------------
// 5. RENDERIZADO E INTERACCIÓN UNIFICADA DEL EXPLORADOR (SCREEN 2)
// -------------------------------------------------------------------------------
render_screen_explorer_content(hx, hy, w, h, is_min, dx, dy, act) = {
    if (is_min == 1.0) { 0.0 } else {
        top = 54.0
        cw = 360.0
        ch = explorer_content_h()

        // Coordenadas en tiempo real del cursor desde registros PVM
        mx = R252
        my = R253

        // Enmascaramiento Modal: si un menú emergente está abierto, bloquea hover de fondo
        bmx = mx
        bmy = my
        if (exp_menu_open == 1.0) { bmx = -1000.0; bmy = -1000.0 } else { 1.0 }
        if (exp_create_open == 1.0) { bmx = -1000.0; bmy = -1000.0 } else { 1.0 }

        // 1. Fondo del área cliente de Screen 2
        rect(hx + 1.0, hy + 54.0, w - 2.0, h - 55.0, 0x090D13)

        // 2. Recorte de Hardware PVM (Scissor Clipping Suave del Contenedor)
        sb_begin_clip(hx, hy, w, h, top, cw, ch)

        ct = hy + 54.0
        cb = (hy + h) - 12.0
        tx = hx + 12.0 - dx
        ty = hy + 66.0 - dy
        clw = w - 30.0
        if (clw < 220.0) { clw = 220.0 } else { 1.0 }

        // Coordenadas de hover restringidas al área visible del árbol (respeta clipping)
        tmx = bmx
        if (bmy < ct) { tmx = -1000.0 } else { 1.0 }
        if (bmy > cb) { tmx = -1000.0 } else { 1.0 }
        if (bmx > (hx + w - 12.0)) { tmx = -1000.0 } else { 1.0 }

        // Contenedor Padre Interior del Explorador (Card Marco Principal)
        ui_card(hx + 6.0 - dx, hy + 58.0 - dy, clw + 12.0, ch - 12.0, 0x0D1117, 0x21262D)

        // Cabecera del Proyecto Raíz con ui_badge de 1 línea
        if (vp_line_visible(ty, ct, cb) == 1.0) {
            ui_badge("PROYECTO", tx, ty - 2.0, 56.0, 0x1F6FEB, 0xFFFFFF)
            text("SketchWarePro [Phasor]", tx + 64.0, ty + 1.0, 9, 0x58A6FF)
            ui_divider(tx, ty + 18.0, clw, 0x21262D)
        } else { 1.0 }
        ty = ty + 24.0

        // --- RAMA 1: Carpeta samples/ ---
        exp_node("samples/ (Aplicativos)", 0.0, 1.0, exp_d1, 1.0, -1.0, 0xF2CC60, tmx, bmy)
        if (exp_d1 == 1.0) {
            val = 0.0; if (exp_ed_file == 1.0) { val = exp_edit_mod } else { 1.0 }
            exp_node("main.ph (Plantilla Base)", 1.0, 0.0, val, 11.0, 1.0, 0x58A6FF, tmx, bmy)

            val = 0.0; if (exp_ed_file == 0.0) { val = exp_edit_mod } else { 1.0 }
            exp_node("chronos_ide.ph (Activo)", 1.0, 0.0, val, 12.0, 0.0, 0x3FB950, tmx, bmy)

            exp_node("fractal_ui.ph", 1.0, 0.0, 0.0, 13.0, 1.0, 0x58A6FF, tmx, bmy)

            if (exp_has_new >= 1.0) {
                exp_node("nuevo_modulo.ph (Nuevo)", 1.0, 0.0, 1.0, 14.0, 4.0, 0x3FB950, tmx, bmy)
            } else { 1.0 }

            if (exp_has_new >= 2.0) {
                exp_node("custom_panel.ph (Clon)", 1.0, 0.0, 1.0, 15.0, 4.0, 0x3FB950, tmx, bmy)
            } else { 1.0 }
        } else { 1.0 }

        // --- RAMA 2: Carpeta lib/ ---
        exp_node("lib/ (Componentes UI)", 0.0, 1.0, exp_d2, 2.0, -1.0, 0xF2CC60, tmx, bmy)
        if (exp_d2 == 1.0) {
            val = 0.0; if (exp_ed_file == 2.0) { val = exp_edit_mod } else { 1.0 }
            exp_node("ui_components.ph", 1.0, 0.0, val, 21.0, 2.0, 0x3FB950, tmx, bmy)

            val = 0.0; if (exp_ed_file == 3.0) { val = exp_edit_mod } else { 1.0 }
            exp_node("ui_screen_explorer.ph", 1.0, 0.0, val, 26.0, 3.0, 0x3FB950, tmx, bmy)

            exp_node("ui_spatial_main.ph", 1.0, 0.0, 0.0, 22.0, 0.0, 0x58A6FF, tmx, bmy)
            exp_node("ui_window_frame.ph", 1.0, 0.0, 0.0, 23.0, 0.0, 0x58A6FF, tmx, bmy)
            exp_node("ui_viewport.ph", 1.0, 0.0, 0.0, 24.0, 0.0, 0x58A6FF, tmx, bmy)
            exp_node("ui_scrollbar.ph", 1.0, 0.0, 0.0, 25.0, 0.0, 0x58A6FF, tmx, bmy)
        } else { 1.0 }

        // --- RAMA 3: Carpeta docs/ & dist/ ---
        exp_node("docs/ & dist/ (Salidas)", 0.0, 1.0, exp_d3, 3.0, -1.0, 0xF2CC60, tmx, bmy)
        if (exp_d3 == 1.0) {
            exp_node("syntax_dictionary.md", 1.0, 0.0, 0.0, 31.0, -1.0, 0xFA7970, tmx, bmy)
            exp_node("chronos_ide.html", 1.0, 0.0, 0.0, 32.0, -1.0, 0x79C0FF, tmx, bmy)
            exp_node("template_new_project.html", 1.0, 0.0, 0.0, 33.0, 1.0, 0x79C0FF, tmx, bmy)
        } else { 1.0 }

        // --- RAMA 4: Carpeta modules/ ---
        exp_node("modules/ (Submodulos)", 0.0, 1.0, exp_d4, 4.0, -1.0, 0xF2CC60, tmx, bmy)
        if (exp_d4 == 1.0) {
            exp_node("sub_panel_ai.ph", 1.0, 0.0, exp_edit_mod, 41.0, 4.0, 0x3FB950, tmx, bmy)
        } else { 1.0 }

        // --- TARJETA INSPECTOR Y ACCIONES RÁPIDAS DENTRO DEL CONTENEDOR ---
        ty = ty + 6.0
        ui_card(tx, ty, clw, 66.0, 0x161B22, 0x30363D)
        text("ARCHIVO SELECCIONADO & ACCIONES:", tx + 8.0, ty + 6.0, 8, 0x8B949E)

        if (exp_sel == 11.0) {
            text("samples/template_new_project/main.ph", tx + 8.0, ty + 22.0, 8, 0x58A6FF)
        } else { 1.0 }
        if (exp_sel == 21.0) {
            text("import \"lib/ui_components.ph\"", tx + 8.0, ty + 22.0, 8, 0x3FB950)
        } else { 1.0 }
        if (exp_sel == 26.0) {
            text("import \"lib/ui_screen_explorer.ph\"", tx + 8.0, ty + 22.0, 8, 0x3FB950)
        } else { 1.0 }
        if (exp_sel != 11.0) {
            if (exp_sel != 21.0) {
                if (exp_sel != 26.0) {
                    text("chronos_ide.ph -> Screen 1 Editor", tx + 8.0, ty + 22.0, 8, 0x79C0FF)
                } else { 1.0 }
            } else { 1.0 }
        } else { 1.0 }

        if (exp_edit_mod == 1.0) {
            ui_badge("MOD ●", tx + clw - 50.0, ty + 4.0, 44.0, 0x1F6FEB, 0xF2CC60)
        } else {
            if (exp_imp_copied == 1.0) {
                ui_badge("COPIADO", tx + clw - 56.0, ty + 4.0, 50.0, 0x238636, 0xFFFFFF)
            } else { 1.0 }
        }

        // 4 Botones Reactivos en el Inspector (con Hover en Vivo y Clic Simple)
        if (ui_button("Abrir", tx + 8.0, ty + 42.0, 48.0, 18.0, 0.0, 0x1F6FEB, tmx, bmy) == 1.0) {
            if (exp_click_pending == 1.0) {
                exp_open_selected_in_editor()
                exp_click_pending = 0.0
            } else { 1.0 }
        } else { 1.0 }

        if (ui_button("Editar", tx + 60.0, ty + 42.0, 52.0, 18.0, exp_edit_mod, 0x1F6FEB, tmx, bmy) == 1.0) {
            if (exp_click_pending == 1.0) {
                exp_open_selected_in_editor()
                exp_edit_mod = 1.0 - exp_edit_mod
                exp_click_pending = 0.0
            } else { 1.0 }
        } else { 1.0 }

        if (ui_button("Import", tx + 116.0, ty + 42.0, 52.0, 18.0, exp_imp_copied, 0x238636, tmx, bmy) == 1.0) {
            if (exp_click_pending == 1.0) {
                exp_imp_copied = 1.0
                exp_click_pending = 0.0
            } else { 1.0 }
        } else { 1.0 }

        if (ui_button("Menu ⋮", tx + 172.0, ty + 42.0, 52.0, 18.0, exp_menu_open, 0x1F6FEB, tmx, bmy) == 1.0) {
            if (exp_click_pending == 1.0) {
                exp_menu_open = 1.0 - exp_menu_open
                exp_create_open = 0.0
                exp_menu_y = (ty - hy) - 60.0
                exp_click_pending = 0.0
            } else { 1.0 }
        } else { 1.0 }

        sb_end_clip()

        // 3. Barra de herramientas superior y scrollbars 2D Neón
        render_explorer_toolbar(hx, hy, w, bmx, bmy)
        ui_subscreen_scrollbars(hx, hy, w, h, top, cw, ch, dx, dy, act, 1.0)

        // Si hubo clic secundario en espacio vacío dentro de Screen 2, abrir menú [⋮]
        if (exp_rclick_pending == 1.0) {
            exp_menu_open = 1.0
            exp_create_open = 0.0
            exp_menu_y = my - hy
            exp_rclick_pending = 0.0
        } else { 1.0 }

        // 4. MENÚ EMERGENTE 1: POPOVER "+ NUEVO ▾" DESDE LA BARRA DE HERRAMIENTAS
        if (exp_create_open == 1.0) {
            clip(hx + 1.0, hy + 28.0, w - 2.0, h - 29.0)
            tl = hy + 53.0
            ui_context_menu("CREAR EN PROYECTO (+)", hx + 6.0, tl, 184.0, 96.0)

            if (ui_menu_item("+ Nuevo Script .ph", hx + 6.0, tl + 22.0, 184.0, 0x3FB950, mx, my) == 1.0) {
                if (exp_click_pending == 1.0) {
                    exp_action_create_file()
                    exp_create_open = 0.0
                    exp_click_pending = 0.0
                } else { 1.0 }
            } else { 1.0 }

            if (ui_menu_item("▸ Submodulo en modules/", hx + 6.0, tl + 40.0, 184.0, 0xF2CC60, mx, my) == 1.0) {
                if (exp_click_pending == 1.0) {
                    exp_d4 = 1.0
                    exp_sel = 41.0
                    exp_ed_file = 4.0
                    exp_create_open = 0.0
                    exp_click_pending = 0.0
                } else { 1.0 }
            } else { 1.0 }

            if (ui_menu_item("⚡ Plantilla Base main.ph", hx + 6.0, tl + 58.0, 184.0, 0x58A6FF, mx, my) == 1.0) {
                if (exp_click_pending == 1.0) {
                    exp_d1 = 1.0
                    exp_sel = 11.0
                    exp_ed_file = 1.0
                    exp_create_open = 0.0
                    exp_click_pending = 0.0
                } else { 1.0 }
            } else { 1.0 }

            if (ui_menu_item("x Cerrar Menu Emergente", hx + 6.0, tl + 76.0, 184.0, 0xFA7970, mx, my) == 1.0) {
                if (exp_click_pending == 1.0) {
                    exp_create_open = 0.0
                    exp_click_pending = 0.0
                } else { 1.0 }
            } else { 1.0 }

            // Si hizo clic fuera del popover, cerrarlo limpiamente
            if (exp_click_pending == 1.0) {
                exp_create_open = 0.0
                exp_click_pending = 0.0
            } else { 1.0 }
            unclip()
        } else { 1.0 }

        // 5. MENÚ EMERGENTE 2: CONTEXTUAL DE FILA [⋮] ANCLADO AL NODO
        if (exp_menu_open == 1.0) {
            clip(hx + 1.0, hy + 28.0, w - 2.0, h - 29.0)
            tl = hy + exp_menu_y
            if (tl > ((hy + h) - 130.0)) { tl = (hy + h) - 130.0 } else { 1.0 }
            if (tl < (hy + 56.0)) { tl = hy + 56.0 } else { 1.0 }

            // Anclado cerca del botón [⋮] a la derecha de la ventana
            gx = (hx + w) - 196.0
            if (gx < (hx + 10.0)) { gx = hx + 10.0 } else { 1.0 }

            if (exp_sel < 10.0) {
                ui_context_menu("ACCIONES DE CARPETA (⋮)", gx, tl, 180.0, 114.0)

                if (ui_menu_item("▸ Expandir / Contraer Rama", gx, tl + 22.0, 180.0, 0xFFFFFF, mx, my) == 1.0) {
                    if (exp_click_pending == 1.0) {
                        exp_toggle_folder(exp_sel)
                        exp_menu_open = 0.0
                        exp_click_pending = 0.0
                    } else { 1.0 }
                } else { 1.0 }

                if (ui_menu_item("+ Nuevo Archivo .ph Aqui", gx, tl + 40.0, 180.0, 0x3FB950, mx, my) == 1.0) {
                    if (exp_click_pending == 1.0) {
                        exp_action_create_file()

// -------------------------------------------------------------------------------
// 4. INTERACCIÓN DE SCROLLBARS 2D
// -------------------------------------------------------------------------------
sb_scan_one(id, mx, my, sw, sh) = {
    if (sb_scan_blocked == 0.0) {
        wx = win_x(id); wy = win_y(id); w = win_w(id); h = win_h(id); is_min = win_min(id)
        if (window_hit_body(wx, wy, w, h, sw, sh, is_min, mx, my) == 1.0) {
            sb_scan_blocked = 1.0
            if (is_min == 0.0) {
                hx = win_hx(id, sw); hy = win_hy(id, sh)
                top = win_top(id); cw = win_cw(id); ch = win_ch(id)
                hit = sb_hit_test_v(hx, hy, w, h, top, cw, ch, win_sc_y(id), mx, my)
                if (hit > 0.0) {
                    sb_scan_win = id; sb_scan_axis = 1.0; sb_scan_hit = hit
                } else {
                    hit = sb_hit_test_h(hx, hy, w, h, top, cw, ch, win_sc_x(id), mx, my)
                    if (hit > 0.0) {
                        sb_scan_win = id; sb_scan_axis = 2.0; sb_scan_hit = hit
                    } else { 1.0 }
                }
            } else { 1.0 }
        } else { 1.0 }
    } else { 1.0 }
    1.0
}

sb_scan(mx, my, sw, sh) = {
    sb_scan_win = 0.0; sb_scan_axis = 0.0; sb_scan_hit = 0.0; sb_scan_blocked = 0.0
    sb_scan_one(4.0, mx, my, sw, sh)
    sb_scan_one(3.0, mx, my, sw, sh)
    sb_scan_one(2.0, mx, my, sw, sh)
    sb_scan_one(1.0, mx, my, sw, sh)
    1.0
}

sb_apply_drag(mx, my, sw, sh) = {
    id = sb_win
    hx = win_hx(id, sw); hy = win_hy(id, sh)
    w = win_w(id); h = win_h(id); top = win_top(id); cw = win_cw(id); ch = win_ch(id)
    if (sb_axis == 1.0) {
        val = sb_apply_drag_v(hx, hy, w, h, top, cw, ch, sb_grab, my)
        set_win_sc(id, win_sc_x(id), val)
    } else {
        val = sb_apply_drag_h(hx, hy, w, h, top, cw, ch, sb_grab, mx)
        set_win_sc(id, val, win_sc_y(id))
    }
    1.0
}

sb_try_start(mx, my, sw, sh) = {
    handled = 0.0
    sb_scan(mx, my, sw, sh)
    if (sb_scan_hit > 0.0) {
        id = sb_scan_win
        hx = win_hx(id, sw); hy = win_hy(id, sh)
        w = win_w(id); h = win_h(id); top = win_top(id); cw = win_cw(id); ch = win_ch(id)
        if (sb_scan_axis == 1.0) {
            sb_grab = sb_calc_grab_v(hx, hy, w, h, top, cw, ch, win_sc_y(id), sb_scan_hit, my)
        } else {
            sb_grab = sb_calc_grab_h(hx, hy, w, h, top, cw, ch, win_sc_x(id), sb_scan_hit, mx)
        }
        sb_win = id; sb_axis = sb_scan_axis
        sb_apply_drag(mx, my, sw, sh)
        handled = 1.0
    } else { 1.0 }
    handled
}

    mob = spatial_is_mobile_view(sw)

    if (mob == 1.0) {
        // Modo Celular: Ventana enfocada al viewport manteniendo proporciones planas 1:1 (sin deformar contenido)
        cw = sw - 12.0
        ch = sh - 64.0
        if (ch < 220.0) { ch = 220.0 } else { 1.0 }

        s1_x = 6.0;                 s1_y = 36.0;                 s1_w = cw; s1_h = ch; s1_min = 0.0
        s3_x = sw + 6.0;            s3_y = 36.0;                 s3_w = cw; s3_h = ch; s3_min = 0.0

        clamp_all_scrolls()

        if (s1_w > (sw * 0.85)) {
            s1_x = 20.0;  s1_y = 44.0;  s1_w = 460.0; s1_h = 330.0
            s3_x = 500.0; s3_y = 44.0;  s3_w = 360.0; s3_h = 330.0

        } else { 1.0 }
    }
    1.0
}

check_hud_clicks(mx, my, sw, sh) = {
    handled = 0.0

    // 1. Clics en la barra superior (S1, S2, S3, S4 y botón Móvil/Escritorio)
    if (my <= 32.0) {
        bx = 96.0
        if (ui_hit_box(bx, 2.0, 30.0, 28.0, mx, my) == 1.0) { spatial_go_sector(0.0, 0.0); handled = 1.0 } else { 1.0 }
        if (ui_hit_box(bx + 32.0, 2.0, 30.0, 28.0, mx, my) == 1.0) { spatial_go_sector(0.0, 1.0); handled = 1.0 } else { 1.0 }
        if (ui_hit_box(bx + 64.0, 2.0, 30.0, 28.0, mx, my) == 1.0) { spatial_go_sector(1.0, 0.0); handled = 1.0 } else { 1.0 }
        if (ui_hit_box(bx + 96.0, 2.0, 30.0, 28.0, mx, my) == 1.0) { spatial_go_sector(1.0, 1.0); handled = 1.0 } else { 1.0 }

        mx_btn = sw - 74.0
        if (ui_hit_box(mx_btn, 2.0, 68.0, 28.0, mx, my) == 1.0) {
            mob = spatial_is_mobile_view(sw)
            if (mob == 1.0) { spatial_view_mode = 2.0 } else { spatial_view_mode = 1.0 }
            handled = 1.0
        } else { 1.0 }
    } else { 1.0 }

    // 2. Clics en el D-Pad flotante toroidal (esquina inferior derecha)
    if (handled == 0.0) {
        cx = sw - 68.0
        cy = sh - 92.0
        if (dpad_collapsed == 1.0) {
            if (ui_hit_box(sw - 46.0, sh - 68.0, 38.0, 38.0, mx, my) == 1.0) {
                dpad_collapsed = 0.0
                handled = 1.0
            } else { 1.0 }
        } else {
            // Arriba (▲) -> mueve cámara hacia arriba en el toroide
            if (ui_hit_box(cx - 18.0, cy - 50.0, 36.0, 28.0, mx, my) == 1.0) {
                spatial_step_sector(0.0, -1.0); handled = 1.0
            } else { 1.0 }
            // Abajo (▼) -> mueve cámara hacia abajo en el toroide
            if (ui_hit_box(cx - 18.0, cy + 20.0, 36.0, 28.0, mx, my) == 1.0) {
                spatial_step_sector(0.0, 1.0); handled = 1.0
            } else { 1.0 }
            // Izquierda (◀) -> mueve cámara hacia la izquierda en el toroide
            if (ui_hit_box(cx - 52.0, cy - 15.0, 30.0, 30.0, mx, my) == 1.0) {
                spatial_step_sector(-1.0, 0.0); handled = 1.0
            } else { 1.0 }
            // Derecha (▶) -> mueve cámara hacia la derecha en el toroide
            if (ui_hit_box(cx + 20.0, cy - 15.0, 30.0, 30.0, mx, my) == 1.0) {
                spatial_step_sector(1.0, 0.0); handled = 1.0
            } else { 1.0 }
            // Centro (minimapa) -> colapsar/expandir HUD
            if (ui_hit_box(cx - 14.0, cy - 13.0, 28.0, 26.0, mx, my) == 1.0) {
                dpad_collapsed = 1.0; handled = 1.0
            } else { 1.0 }
        }
    } else { 1.0 }

    handled
}

apply_active_resize(mx, my) = {
    dx = mx - resize_orig_mx
    dy = my - resize_orig_my
    val = 220.0; delta = 160.0
    if (resize_target_win == 1.0) { val = 280.0; delta = 180.0 } else { 1.0 }

    w = calc_resize_w(resize_target_dir, resize_orig_w, dx, val)
    hx = calc_resize_x(resize_target_dir, resize_orig_x, resize_orig_w, w)
    h = calc_resize_h(resize_target_dir, resize_orig_h, dy, delta)
    hy = calc_resize_y(resize_target_dir, resize_orig_y, resize_orig_h, h)

    if (resize_target_win == 1.0) { s1_x = hx; s1_y = hy; s1_w = w; s1_h = h } else { 1.0 }
    if (resize_target_win == 2.0) { s2_x = hx; s2_y = hy; s2_w = w; s2_h = h } else { 1.0 }
    if (resize_target_win == 3.0) { s3_x = hx; s3_y = hy; s3_w = w; s3_h = h } else { 1.0 }
    if (resize_target_win == 4.0) { s4_x = hx; s4_y = hy; s4_w = w; s4_h = h } else { 1.0 }
    clamp_win_scroll(resize_target_win)
    1.0
}

apply_active_drag(mx, my, pan_x, pan_y) = {

    if (drag_target_win == 1.0) { s1_x = tx; s1_y = ty } else { 1.0 }

handle_workspace_interactions(mx, my, sw, sh, pd, pan_x, pan_y) = {

    if (pd == 1.0) {
        handled = 0.0

        // 0. Clics en HUD (Barra superior y D-Pad flotante) con edge-trigger
        if (prev_click_down == 0.0) {
            handled = check_hud_clicks(mx, my, sw, sh)
        } else { 1.0 }

        // 1. Arrastre activo de scrollbar thumb
        if (handled == 0.0) {
            if (sb_win > 0.0) { sb_apply_drag(mx, my, sw, sh); handled = 1.0 } else { 1.0 }
        } else { 1.0 }

        // 2. Redimensionamiento y arrastre libre de ventana (solo en Modo Escritorio)
        if (mob == 0.0) {
            if (handled == 0.0) {
                if (resize_target_win > 0.0) { apply_active_resize(mx, my); handled = 1.0 } else { 1.0 }
            } else { 1.0 }
            if (handled == 0.0) {
                if (drag_target_win > 0.0) { apply_active_drag(mx, my, pan_x, pan_y); handled = 1.0 } else { 1.0 }
            } else { 1.0 }
        } else { 1.0 }

        // 3. Nuevas interacciones dentro del área de trabajo
        if (handled == 0.0) {
            if (my > 32.0) { if (my < (sh - 24.0)) {
                if (mob == 0.0) {
                    if (prev_click_down == 0.0) { handled = check_minimize_buttons(mx, my, sw, sh) } else { 1.0 }
                } else { 1.0 }
